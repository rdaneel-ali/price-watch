[project]
name = "price-watch"
version = "0.1.0"
description = "Watch prices across sources and report the best current price."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15,<5",
    "httpx>=0.28,<1",
    "pydantic>=2.14,<3",
]

[project.scripts]
pw = "price_watch.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
